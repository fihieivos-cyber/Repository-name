name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP Directly
        run: unzip -o blue_magic_*.zip -d extracted_files

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: extracted_files/ชื่อโฟลเดอร์ข้างใน

      - name: Build APK
        run: flutter build apk --release
        working-directory: extracted_files/ชื่อโฟลเดอร์ข้างใน

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: extracted_files/ชื่อโฟลเดอร์ข้างใน/build/app/outputs/flutter-apk/app-release.apk
